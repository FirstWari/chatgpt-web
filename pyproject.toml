[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-web"
version = "0.1.0"
description = "Drive a logged-in ChatGPT web session over CDP: MCP stdio server + cgweb CLI (projects, files, long Pro replies)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.50,<2",
    "mcp>=2,<3",
    "anyio>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cgweb = "chatgpt_web.cli:main"
chatgpt-web-mcp = "chatgpt_web.mcp_server:main"

[tool.setuptools.packages.find]
include = ["chatgpt_web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
